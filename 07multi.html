        <h3>EJEMPLO CANVAS</h3>
        <div style="text-align: center; background-color: #0b0f19; padding: 20px; border-radius: 10px; width: fit-content; margin: 10px auto;">
    <h2 style="color: #38bdf8; margin-top: 0; font-family: sans-serif;">Interactive Canvas</h2>
    <p style="color: #94a3b8; font-family: sans-serif; margin-bottom: 15px;">Colorful bouncing balls demonstrating HTML5 Canvas & JavaScript</p>
    
    <!-- El elemento Canvas -->
    <canvas id="miCanvasInteractivo" width="600" height="400" style="background-color: #0f172a; border-radius: 8px; cursor: pointer; border: 1px solid #1e293b;"></canvas>
    
    <p style="color: #64748b; font-family: sans-serif; font-size: 14px; margin-top: 15px; margin-bottom: 0;">¡Haz clic en el canvas para añadir más pelotas!</p>
</div>

<script>
    const canvas = document.getElementById('miCanvasInteractivo');
    const ctx = canvas.getContext('2d');
    const pelotas = [];
    
    // Paleta de colores vibrantes como en la imagen de referencia
    const colores = ['#ef4444', '#f97316', '#facc15', '#4ade80', '#06b6d4', '#a855f7', '#ec4899'];

    // Clase para crear y manejar cada pelota
    class Pelota {
        constructor(x, y) {
            this.radio = Math.random() * 15 + 10; // Tamaño aleatorio entre 10 y 25
            // Si se pasa x, y (por el clic), usa esa posición, si no, posición aleatoria
            this.x = x || Math.random() * (canvas.width - this.radio * 2) + this.radio;
            this.y = y || Math.random() * (canvas.height - this.radio * 2) + this.radio;
            this.dx = (Math.random() - 0.5) * 5; // Velocidad X aleatoria
            this.dy = (Math.random() - 0.5) * 5; // Velocidad Y aleatoria
            this.color = colores[Math.floor(Math.random() * colores.length)];
        }

        dibujar() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radio, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            
            // Efecto de brillo (glow)
            ctx.shadowBlur = 15;
            ctx.shadowColor = this.color;
            
            ctx.fill();
            ctx.closePath();
        }

        actualizar() {
            // Detectar colisión con las paredes para rebotar
            if (this.x + this.radio > canvas.width || this.x - this.radio < 0) {
                this.dx = -this.dx;
            }
            if (this.y + this.radio > canvas.height || this.y - this.radio < 0) {
                this.dy = -this.dy;
            }

            // Mover la pelota
            this.x += this.dx;
            this.y += this.dy;

            this.dibujar();
        }
    }

    // Crear 40 pelotas iniciales
    for (let i = 0; i < 40; i++) {
        pelotas.push(new Pelota());
    }

    // Bucle de animación
    function animarMultiples() {
        requestAnimationFrame(animarMultiples);
        
        // Limpiar el canvas en cada frame
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Efecto para que los colores brillen más cuando se superponen
        ctx.globalCompositeOperation = 'screen';

        // Actualizar y dibujar todas las pelotas
        pelotas.forEach(pelota => pelota.actualizar());
    }

    animarMultiples();

    // Evento interactivo: Añadir pelotas al hacer clic
    canvas.addEventListener('click', function(event) {
        const rect = canvas.getBoundingClientRect();
        // Calcular la posición exacta del ratón dentro del canvas
        const mouseX = event.clientX - rect.left;
        const mouseY = event.clientY - rect.top;
        
        // Añadir 3 pelotas nuevas en la posición del clic
        for(let i = 0; i < 3; i++) {
            pelotas.push(new Pelota(mouseX, mouseY));
        }
    });
</script>
